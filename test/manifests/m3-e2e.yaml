apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mycni-e2e
  namespace: default
  labels:
    app: mycni-e2e
spec:
  selector:
    matchLabels:
      app: mycni-e2e
  template:
    metadata:
      labels:
        app: mycni-e2e
    spec:
      tolerations:
        - operator: Exists
          effect: NoSchedule
      containers:
        - name: probe
          image: mycni:latest
          imagePullPolicy: IfNotPresent
          command: ["/bin/mycni-e2e", "serve", "--addr=:8080"]
          securityContext:
            capabilities:
              add: ["NET_RAW"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: mycni-e2e-svc
  namespace: default
  labels:
    app: mycni-e2e
spec:
  type: ClusterIP
  selector:
    app: mycni-e2e
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
